name: Release Please

"on":
  push:
    branches:
      - main

# The separately provisioned repository-scoped token has the write permissions.
# Never fall back to GITHUB_TOKEN: its PR events would not start application CI.
permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require provisioned release credentials
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if ! test -n "$RELEASE_PLEASE_TOKEN"; then
            echo "::error::Provision RELEASE_PLEASE_TOKEN as documented in docs/releases.md."
            exit 1
          fi
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
